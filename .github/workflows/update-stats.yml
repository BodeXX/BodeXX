name: Update profile stats

on:
  schedule:
    # Todo dia às 03:17 UTC (00:17 em Salvador)
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update-stats:
    name: Generate stats cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&border_radius=10&rank_icon=github&locale=pt-br"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&border_radius=10&locale=pt-br"
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos cards."
            exit 0
          fi
          git commit -m "chore: update profile stats cards"
          git pull --rebase origin main
          git push origin HEAD:main
